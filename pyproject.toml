[project]
name = "phoenixrag"
version = "0.1.0"
description = "PhoenixRAG - Self-Healing Multi-Agent RAG Platform (Phase 2: IAM)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",

    # --- Configuration ---
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",

    # --- Database (PostgreSQL via SQLAlchemy) ---
    "sqlalchemy>=2.0.35,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "psycopg2-binary>=2.9.9,<3.0.0",

    # --- Cache ---
    "redis>=5.1.0,<6.0.0",

    # --- Vector store client (connection only, no RAG logic yet) ---
    "qdrant-client>=1.11.3,<2.0.0",

    # --- Object storage ---
    "minio>=7.2.9,<8.0.0",

    # --- Logging ---
    "structlog>=24.4.0,<25.0.0",
    "python-json-logger>=2.0.7,<3.0.0",

    # --- Utilities ---
    "httpx>=0.27.2,<0.28.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "tenacity>=9.0.0,<10.0.0",

    # --- IAM / Security ---
    "argon2-cffi>=23.1.0,<24.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    # --- Testing ---
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",

    # --- Linting & formatting ---
    "ruff>=0.6.9,<0.7.0",
    "black>=24.10.0,<25.0.0",
    "mypy>=1.11.2,<2.0.0",

    # --- Git hooks ---
    "pre-commit>=3.8.0,<4.0.0",

    # --- Dev-only tooling ---
    "ipython>=8.28.0,<9.0.0",

    # --- IAM test support ---
    "aiosqlite>=0.20.0,<0.21.0",
    "faker>=30.0.0,<31.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff (linting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common bugs/design issues)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python idioms)
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "B008",   # allow function calls in argument defaults (needed for FastAPI's Depends())
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]  # unused fixture arguments are normal in tests

# ---------------------------------------------------------------------------
# Black (formatting)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = "alembic/versions"

# ---------------------------------------------------------------------------
# Mypy (static typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "tests"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests requiring live infrastructure (Postgres, Redis, Qdrant)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
